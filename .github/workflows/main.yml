name: Rust

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
        rust: [stable]
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build without std
      run: cargo build --no-default-features --features=libm

    - name: Build with std
      run: cargo build

    - name: Build library without tracing
      run: cargo build -p harfrust

    - name: MSRV Build (Rust 1.85)
      run: cargo +1.85 build

    - name: Run tests
      run: cargo test --verbose

    - name: Run tests with icu4x
      run: cargo test --verbose --features icu

    - name: Build core C API without subsetting
      run: cargo build -p harfrust_capi --no-default-features --target-dir target/capi-default

    - name: Subset C API smoke test
      run: |
        cargo build -p harfrust_capi --features subset
        cargo test -p harfrust_capi --features subset
        python3 - <<'PY'
        import ctypes, sys
        suffix = "dylib" if sys.platform == "darwin" else "so"
        core = ctypes.CDLL(f"target/capi-default/debug/libharfrust_c.{suffix}")
        assert hasattr(core, "hr_shape")
        assert not hasattr(core, "hr_subset_or_fail")
        subset = ctypes.CDLL(f"target/debug/libharfrust_c.{suffix}")
        assert hasattr(subset, "hr_shape") and hasattr(subset, "hr_subset_or_fail")
        PY
        cc -std=c99 -pedantic-errors -Werror \
          -Iharfrust_capi/include \
          harfrust_capi/examples/subset.c -Ltarget/debug \
          -lharfrust_c -Wl,-rpath,"$PWD/target/debug" \
          -o /tmp/hr-subset
        /tmp/hr-subset harfrust/tests/fonts/rb_custom/PT_Sans-Caption-Web-Regular.ttf

    - name: HarfBuzz C++ ownership helpers
      run: |
        for standard in c++11 c++17; do
          for order in CORE SUBSET_FIRST SUBSET_LAST; do
            library_directory=target/debug
            if [ "$order" = CORE ]; then
              library_directory=target/capi-default/debug
            fi
            c++ -std="$standard" -pedantic-errors -Wall -Wextra -Werror \
              -D"HR_TEST_$order" \
              -Iharfrust_capi/include \
              harfrust_capi/tests/cplusplus.cc -L"$library_directory" \
              -lharfrust_c -Wl,-rpath,"$PWD/$library_directory" \
              -o /tmp/hr-cplusplus
            /tmp/hr-cplusplus harfrust/tests/fonts/rb_custom/PT_Sans-Caption-Web-Regular.ttf
          done
        done

    - name: Rustfmt
      run: cargo fmt --all -- --check

    - name: Draw and paint C API
      run: |
        cargo build -p harfrust_capi --features draw --target-dir target/capi-draw
        cargo test -p harfrust_capi --features draw
        cargo +1.85 check -p harfrust_capi --features draw,paint
        cargo build -p harfrust_capi --features subset,paint
        cargo test -p harfrust_capi --features subset,paint
        python3 - <<'PY'
        import ctypes, sys
        suffix = "dylib" if sys.platform == "darwin" else "so"
        for directory, draw, paint, subset in [
            ("capi-default", False, False, False),
            ("capi-draw", True, False, False),
            (None, True, True, True),
        ]:
            base = f"target/{directory}/debug" if directory else "target/debug"
            lib = ctypes.CDLL(f"{base}/libharfrust_c.{suffix}")
            assert hasattr(lib, "hr_shape")
            assert hasattr(lib, "hr_font_draw_glyph_or_fail") == draw
            assert hasattr(lib, "hr_font_paint_glyph_or_fail") == paint
            assert hasattr(lib, "hr_subset_or_fail") == subset
        PY
        cc -std=c99 -pedantic-errors -Wall -Wextra -Werror \
          -Iharfrust_capi/include harfrust_capi/examples/rendering.c \
          -Ltarget/debug -lharfrust_c -Wl,-rpath,"$PWD/target/debug" \
          -o /tmp/hr-rendering
        /tmp/hr-rendering harfrust_capi/tests/fonts/Rendering.ttf
        c++ -x c++ -std=c++11 -pedantic-errors -Wall -Wextra -Werror \
          -Iharfrust_capi/include harfrust_capi/examples/rendering.c \
          -Ltarget/debug -lharfrust_c -Wl,-rpath,"$PWD/target/debug" \
          -o /tmp/hr-rendering-cpp
        /tmp/hr-rendering-cpp harfrust_capi/tests/fonts/Rendering.ttf

    - name: AAT C++ source compatibility
      run: |
        c++ -std=c++11 -pedantic-errors -Wall -Wextra -Werror \
          -Iharfrust_capi/include -fsyntax-only harfrust_capi/tests/aat_source_compat.cc

    - name: C++ source compatibility
      run: |
        for standard in c++11 c++17; do
          c++ -std="$standard" -pedantic-errors -Wall -Wextra -Werror \
            -Iharfrust_capi/include -fsyntax-only harfrust_capi/tests/source_compat.cc
        done

    - name: Clippy
      run: cargo clippy --all-features --all-targets -- -D warnings

    # hr-shape enables tracing, so the workspace build above always has it.
    - name: Clippy without tracing
      run: cargo clippy -p harfrust_capi --all-targets -- -D warnings

  check-no-std:
    name: cargo check no std (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [libm, "libm,tracing"]
    steps:
      - uses: actions/checkout@v6

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85
          # Use a target without `std` to make sure we don't link to `std`
          target: thumbv7em-none-eabihf

      - name: cargo build harfrust
        run: cargo build -p harfrust --target thumbv7em-none-eabihf --no-default-features --features=${{ matrix.features }}

  # The C API is unsafe code throughout, so its tests also run under Miri,
  # which checks what a native run cannot: that every pointer is still good
  # for the access made through it, that nothing is leaked, and that threads
  # do not race. It checks against one aliasing model at a time, and the two
  # disagree in places, so each gets a run of the whole suite.
  miri:
    name: Miri on the C API (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Miri runs these tests a thousand times slower than they run natively, or
    # worse, so one that is new and heavy can take hours. That should fail the
    # job, for the test to be shrunk or ignored under Miri, before it holds a
    # runner that long.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Stacked Borrows
            flags: ""
            tests: ""
          - name: Tree Borrows
            flags: -Zmiri-tree-borrows
            tests: ""
          # One run takes the threads of a test through one schedule. This
          # takes the tests that share objects between threads through
          # sixteen, for the data race detector to watch.
          - name: thread interleavings
            flags: -Zmiri-many-seeds=0..16
            tests: several_threads
    env:
      # Miri is only in nightly toolchains, and not in every one, so the date
      # is pinned. To bump it, pick a date on which
      # https://rust-lang.github.io/rustup-components-history/ lists `miri`
      # for x86_64-unknown-linux-gnu, and be ready to look into what the
      # newer Miri reports that this one let pass.
      MIRI_NIGHTLY: nightly-2026-11-23
      # The tests read font files, which Miri does not let a program do
      # unless its isolation from the host is turned off.
      MIRIFLAGS: -Zmiri-disable-isolation ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v6

      - name: Install nightly with Miri
        run: |
          rustup toolchain install "$MIRI_NIGHTLY" --profile minimal --component miri --component rust-src
          rustup override set "$MIRI_NIGHTLY"
          cargo miri setup

      # One process, which Miri ends at the first error it finds. The tests
      # it cannot run, or would take too long over, are marked
      # `#[cfg_attr(miri, ignore)]` where they are defined.
      - name: Run the C API tests under Miri
        run: cargo miri test -p harfrust_capi --features subset,paint --lib ${{ matrix.tests }}
