name: Rust

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
        rust: [stable]
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build without std
      run: cargo build --no-default-features --features=libm

    - name: Build with std
      run: cargo build

    - name: MSRV Build (Rust 1.85)
      run: cargo +1.85 build

    - name: Run tests
      run: cargo test --verbose

    - name: Run tests with icu4x
      run: cargo test --verbose --features icu

    - name: Build core C API without subsetting
      run: cargo build -p harfrust_capi --no-default-features --target-dir target/capi-default

    - name: Subset C API smoke test
      run: |
        cargo build -p harfrust_capi --features subset
        cargo test -p harfrust_capi --features subset
        python3 - <<'PY'
        import ctypes, sys
        suffix = "dylib" if sys.platform == "darwin" else "so"
        core = ctypes.CDLL(f"target/capi-default/debug/libharfrust_c.{suffix}")
        assert hasattr(core, "hr_shape")
        assert not hasattr(core, "hr_subset_or_fail")
        subset = ctypes.CDLL(f"target/debug/libharfrust_c.{suffix}")
        assert hasattr(subset, "hr_shape") and hasattr(subset, "hr_subset_or_fail")
        PY
        cc -std=c99 -pedantic-errors -Werror \
          -Iharfrust_capi/include \
          harfrust_capi/examples/subset.c -Ltarget/debug \
          -lharfrust_c -Wl,-rpath,"$PWD/target/debug" \
          -o /tmp/hr-subset
        /tmp/hr-subset harfrust/tests/fonts/rb_custom/PT_Sans-Caption-Web-Regular.ttf

    - name: HarfBuzz C++ ownership helpers
      run: |
        for standard in c++11 c++17; do
          for order in CORE SUBSET_FIRST SUBSET_LAST; do
            library_directory=target/debug
            if [ "$order" = CORE ]; then
              library_directory=target/capi-default/debug
            fi
            c++ -std="$standard" -pedantic-errors -Wall -Wextra -Werror \
              -D"HR_TEST_$order" \
              -Iharfrust_capi/include \
              harfrust_capi/tests/cplusplus.cc -L"$library_directory" \
              -lharfrust_c -Wl,-rpath,"$PWD/$library_directory" \
              -o /tmp/hr-cplusplus
            /tmp/hr-cplusplus harfrust/tests/fonts/rb_custom/PT_Sans-Caption-Web-Regular.ttf
          done
        done

    - name: Rustfmt
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --all-features --all-targets -- -D warnings

  check-no-std:
    name: cargo check no std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85
          # Use a target without `std` to make sure we don't link to `std`
          target: thumbv7em-none-eabihf

      - name: cargo build harfrust
        run: cargo build -p harfrust --target thumbv7em-none-eabihf --no-default-features --features=libm
