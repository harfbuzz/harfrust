language = "C"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "both"
tab_width = 2
usize_is_size_t = true
no_includes = false
sys_includes = ["stdint.h", "stddef.h"]

header = """
/* Generated by cbindgen from the harfrust-capi crate. Do not edit by hand.
 *
 * Regenerate with:
 *
 *   cbindgen --config harfrust-capi/cbindgen.toml \\
 *            --crate harfrust-capi \\
 *            --output harfrust-capi/include/hr.h
 *
 * This is the C API for HarfRust, mirroring the shaping half of HarfBuzz's
 * API with an `hr_` prefix in place of `hb_`. Enumerators, flag values and
 * struct layouts match their HarfBuzz counterparts exactly.
 */
"""

trailer = """
/* Convenience macros with no Rust counterpart, matching HarfBuzz's. */

/** An unset language. */
#define HR_LANGUAGE_INVALID ((hr_language_t) 0)

/** Segment properties with every field unset. */
#define HR_SEGMENT_PROPERTIES_DEFAULT { HR_DIRECTION_INVALID, HR_SCRIPT_INVALID, HR_LANGUAGE_INVALID, (void *) 0, (void *) 0 }
"""

[parse]
parse_deps = false

[export]
prefix = ""

[enum]
prefix_with_name = false
rename_variants = "None"
derive_helper_methods = false

[const]
allow_static_const = false
allow_constexpr = false

[fn]
sort_by = "None"

[struct]
derive_eq = false
