language = "C"
include_guard = "HARFRUST_SUBSET_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "both"
tab_width = 2
sys_includes = ["stdint.h", "stddef.h"]
includes = ["hr.h"]
header = "/* Generated by cbindgen from harfrust_capi/src/subset/mod.rs. Do not edit by hand. */"

[parse]
parse_deps = false

[export]
exclude = ["hr_blob_t", "hr_face_t", "hr_set_t", "hr_map_t", "hr_destroy_func_t", "hr_user_data_key_t"]

[fn]
sort_by = "None"
