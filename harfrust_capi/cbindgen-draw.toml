language = "C"
include_guard = "HARFRUST_DRAW_H"
cpp_compat = true
documentation = true
style = "both"
tab_width = 2
includes = ["hr.h"]
header = "/* Generated by cbindgen from harfrust_capi/src/draw.rs. */"

trailer = """
#define HR_DRAW_STATE_DEFAULT {0, 0.f, 0.f, 0.f, 0.f, {0}}
"""

[export]
exclude = ["hr_bool_t", "hr_codepoint_t", "hr_destroy_func_t", "hr_user_data_key_t", "hr_font_t", "hr_font_funcs_t", "hr_blob_t", "hr_tag_t", "hr_glyph_extents_t"]
