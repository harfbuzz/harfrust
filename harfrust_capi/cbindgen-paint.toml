language = "C"
include_guard = "HARFRUST_PAINT_H"
cpp_compat = true
documentation = true
style = "both"
tab_width = 2
includes = ["hr.h", "hr-draw.h"]
after_includes = "struct hr_color_line_t;"
header = "/* Generated by cbindgen from harfrust_capi/src/paint.rs. */"

trailer = """
#define HR_COLOR(b,g,r,a) ((hr_color_t)((((uint32_t)(b) & 0xffu) << 24) | (((uint32_t)(g) & 0xffu) << 16) | (((uint32_t)(r) & 0xffu) << 8) | ((uint32_t)(a) & 0xffu)))
"""

[export]
exclude = ["hr_bool_t", "hr_codepoint_t", "hr_destroy_func_t", "hr_user_data_key_t", "hr_font_t", "hr_font_funcs_t", "hr_blob_t", "hr_tag_t", "hr_glyph_extents_t", "hr_draw_funcs_t"]
